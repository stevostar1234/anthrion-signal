name: Collect intelligence and deploy

on:
  schedule:
    - cron: '50 * * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      collect:
        description: Collect new notices before deployment
        type: boolean
        default: true
      full_tests:
        description: Force the full desktop and mobile regression suite
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']

concurrency:
  group: anthrion-signal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
      signature: ${{ steps.changed.outputs.signature }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - name: Plan collection and verification
        id: plan
        env:
          COLLECT_REQUESTED: ${{ inputs.collect }}
          FORCE_FULL_TESTS: ${{ inputs.full_tests }}
        run: python scripts/refresh_plan.py plan
      - name: Save previous publication signature
        run: python scripts/publication_state.py before
      - name: Collect public opportunities
        id: collect
        if: steps.plan.outputs.collect == 'true'
        env:
          MAX_PAGES_PER_SOURCE: '80'
          PYTHONUNBUFFERED: '1'
        run: python -m anthrion_signal.cli ingest
      - name: Validate pipeline and public dataset
        run: |
          python -m pytest -q
          python -m ruff check pipeline scripts/refresh_plan.py
          python -m anthrion_signal.cli validate
          python -m anthrion_signal.cli export
          python scripts/check_public_output.py
      - name: Detect meaningful publication changes
        id: changed
        env:
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' }}
        run: python scripts/publication_state.py after
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
      - name: Test and build dashboard
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm test
          npm run build
      - name: Install browser
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Full browser regression against production build
        if: steps.plan.outputs.full_tests == 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
        run: npx playwright test
      - name: Data refresh desktop and mobile smoke tests
        if: steps.changed.outputs.deploy == 'true' && steps.plan.outputs.full_tests != 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
        run: npx playwright test data-refresh.spec.ts
      - name: Record successful full regression
        if: steps.plan.outputs.full_tests == 'true'
        run: python scripts/refresh_plan.py passed
      - name: Persist canonical state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update public opportunity intelligence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload Pages build
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
          retention-days: 1
      - name: Record run summary
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: python scripts/run_summary.py

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-publication:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record successful publication
        env:
          DEPLOYED_SIGNATURE: ${{ needs.build.outputs.signature }}
        run: |
          python scripts/publication_state.py deployed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publication_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record successful intelligence publication [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
