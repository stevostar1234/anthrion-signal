  technical_context: [software, platform, application, system, implementation, integration, migration, development, automation, digital, cloud, technology, workflow, solution, api, data]
  incompatible_platforms: [microsoft dynamics, dynamics 365, hubspot, oracle siebel, sap crm, servicenow]
  mandatory_constraints: [no alternative, alternatives will not be accepted, alternative platforms will not be considered, alternative crm platforms will not be considered, all work must be implemented within, only this platform, mandatory]
  permanent_roles: [permanent employee, permanent position, permanent role, employee vacancy, permanent vacancy, full time employee, full-time employee]
  irrelevant_physical: [road resurfacing, building construction, construction materials, catering services, grounds maintenance, office furniture, medical consumables, refuse collection, asbestos removal, boiler replacement, security guarding, sulfuric acid, sulphuric acid, tunnel activation, shaft equipment installation, auger compactors, interior compactors]
