version: '2026-09-11.1'
charter: >-
  Anthrion provides Salesforce platform and ecosystem development, administration,
  architecture, implementation, integration, migration, managed support and technical
  consulting. It also implements standalone AI, LLMs, agents and automation using
  suitable models and platforms. Assess the buyer's functional needs, not only named
  products. Product lists are examples, not a delivery whitelist. A plausible platform
  route does not establish supplier eligibility, credentials or past references.
source: Company capability charter approved for Anthrion Signal
discovery:
  backfill_days: 365
  backfill_page_fraction: 0.25
  minimum_candidate_score: 12
  delivery_evidence_terms: [implementation, implement, development, develop, configuration, configure, integration, integrate, migration, migrate, enhancement, build, implementierung, entwicklung, konfiguration, systemintegration, implementazione, sviluppo, configurazione, integrazione, migrazione, implantación, implementación, desarrollo, integración, migración, mise en oeuvre, développement, intégration, migration, implementatie, ontwikkeling, implementering, utveckling, utvikling, udvikling, kehittäminen, toteutus, υλοποίηση, ανάπτυξη, διασύνδεση, implementação, desenvolvimento]
  commercial_intent: [procurement, tender, rfp, rfq, rfi, itt, eoi, request for proposal, request for information, request for quotation, supplier required, seeking supplier, implementation partner, delivery partner, planned procurement, market engagement, contract opportunity, call for suppliers, framework, dynamic purchasing system]
  publication_intent: [planned procurement, procurement pipeline, market engagement, supplier engagement, seeking suppliers, seeking a supplier, seeking partners, call for suppliers, invitation to tender, invitations to tender, tender opportunity, contract opportunity, request for proposals, request for information, call for proposals, funding competition, apply for funding, expression of interest, expressions of interest]
