version: "1.0"
sources:
  - id: find_tender
    name: Find a Tender
    enabled: true
    collector: ocds_cursor
    source_type: official_notice
    url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
    website: https://www.find-tender.service.gov.uk
    docs: https://www.find-tender.service.gov.uk/apidocumentation/1.0/GET-ocdsReleasePackages
    record_url: https://www.find-tender.service.gov.uk/api/1.0/ocdsRecordPackages/{ocid}
    hydrate_records: true
    record_limit: 4
    from_param: updatedFrom
    to_param: updatedTo
    date_format: '%Y-%m-%dT%H:%M:%S'
    stages: [planning, tender, award]
    limit: 100
    overlap_minutes: 30
    window_hours: 6
    country: GB
  - id: contracts_finder
    name: Contracts Finder
    enabled: true
    collector: ocds_cursor
    source_type: official_notice
    url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search
    website: https://www.contractsfinder.service.gov.uk
    docs: https://www.contractsfinder.service.gov.uk/apidocumentation
    record_url: https://www.contractsfinder.service.gov.uk/Published/OCDS/Record/{ocid}
    hydrate_records: true
    record_limit: 4
    from_param: publishedFrom
    to_param: publishedTo
    stages: [planning, tender, award, implementation]
    limit: 100
    overlap_minutes: 60
    window_hours: 24
    country: GB
  - id: scotland
    name: Public Contracts Scotland
    enabled: true
    collector: ocds_monthly
    source_type: official_notice
    url: https://api.publiccontractsscotland.gov.uk/v1/Notices
    website: https://www.publiccontractsscotland.gov.uk
    docs: https://api.publiccontractsscotland.gov.uk/v1
    record_url: https://api.publiccontractsscotland.gov.uk/v1/Notice?id={ocid}
    notice_types: [1, 2, 3, 4, 5, 6, 7, 14, 20, 101, 102, 103, 104]
    recent_months: 2
    country: GB
    region: Scotland
  - id: wales
    name: Sell2Wales
    enabled: true
    collector: ocds_monthly
    source_type: official_notice
    url: https://api.sell2wales.gov.wales/v1/Notices
    fallback_url: https://www.sell2wales.gov.wales/Search/Search_mainpage.aspx
    website: https://www.sell2wales.gov.wales
    docs: https://www.sell2wales.gov.wales/helpandresources/ocds/publicationpolicy
    record_url: https://api.sell2wales.gov.wales/v1/Notice?id={ocid}&locale=2057
    notice_types: [1, 2, 3, 4, 5, 6, 7, 14, 20, 51, 52, 53]
    recent_months: 2
    locale: 2057
    country: GB
    region: Wales
  - id: govuk
    name: GOV.UK
    enabled: true
    collector: govuk
    source_type: official_publication
    url: https://www.gov.uk/api/search.json
    website: https://www.gov.uk
    docs: https://www.gov.uk/search/research-and-statistics
    country: GB
    limit: 100
  - id: digital_outcomes
    name: Digital Outcomes
    enabled: true
    collector: digital_outcomes
    source_type: official_notice
    url: https://redirect.contractawardservice.gca.gov.uk/digital-outcomes/opportunities
    website: https://redirect.contractawardservice.gca.gov.uk
    docs: https://redirect.contractawardservice.gca.gov.uk/digital-outcomes/opportunities
    country: GB
    request_delay_seconds: 1
  - id: upcoming_agreements
    name: GCA Upcoming Agreements
    enabled: true
    collector: upcoming_agreements
    source_type: official_publication
    url: https://www.gca.gov.uk/agreements/upcoming
    website: https://www.gca.gov.uk
    docs: https://www.gca.gov.uk/agreements/upcoming
    country: GB
    request_delay_seconds: 1
  - id: ted
    name: TED Europe
    enabled: true
    collector: ted
    source_type: official_notice
    url: https://api.ted.europa.eu/v3/notices/search
    website: https://ted.europa.eu
    docs: https://docs.ted.europa.eu/ODS/latest/reuse/search-api.html
    limit: 200
    country: EU
    countries: [IT, SE, FI, DK, 'NO', IS, DE, ES, GR]
    coverage: European public notices published on TED; national-only notices are not included.
  - id: usaspending
    name: USAspending
    enabled: false
    collector: usaspending
    source_type: official_award
    url: https://api.usaspending.gov/api/v2/search/spending_by_award/
    website: https://www.usaspending.gov
    docs: https://api.usaspending.gov/docs/endpoints
    country: US
    coverage: Federal contract awards and incumbent intelligence, not open tenders. Values are award obligations.
    keywords: [Salesforce, MuleSoft, Agentforce, customer relationship management, generative AI, digital transformation]
    lookback_days: 90
    limit: 100
  - id: germany
    name: German Public Procurement
    enabled: true
    collector: german_daily
    source_type: official_notice
    url: https://oeffentlichevergabe.de/api/notice-exports
    website: https://oeffentlichevergabe.de
    docs: https://oeffentlichevergabe.de/documentation/api/opendata
    country: DE
    initial_lookback_days: 7
    max_days_per_run: 3
    record_url: https://oeffentlichevergabe.de/ui/de/notices/{ocid}
    coverage: Completed daily national and EU notice exports, with original eForms submission deadlines.
  - id: spain
    name: Spanish Public Procurement
    enabled: true
    collector: spain_atom
    source_type: official_notice
    url: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
    website: https://contrataciondelsectorpublico.gob.es
    docs: https://www.hacienda.gob.es/es-ES/GobiernoAbierto/Datos%20Abiertos/Paginas/LicitacionesContratante.aspx
    country: ES
    initial_lookback_days: 7
    max_pages_per_run: 3
    coverage: PLACSP contracting profiles excluding minor contracts. Source-local deadlines without an offset require notice verification.
  - id: nyc_city_record
    name: NYC City Record
    enabled: true
    collector: nyc_city_record
    source_type: official_notice
    url: https://data.cityofnewyork.us/resource/dg92-zbpx.json
    website: https://a856-cityrecord.nyc.gov
    docs: https://data.cityofnewyork.us/City-Government/City-Record-Online/dg92-zbpx
    country: US
    limit: 200
    max_pages_per_run: 6
    refresh_hours: 24
    coverage: New York City procurement notices, including open solicitations and subsequent status changes.
  - id: grants
    name: Grants.gov
    enabled: true
    collector: grants
    source_type: official_funding
    url: https://api.grants.gov/v1/api/search2
    detail_url: https://api.grants.gov/v1/api/fetchOpportunity
    website: https://www.grants.gov
    docs: https://www.grants.gov/api/api-guide
    country: US
    coverage: Federal funding and forecast opportunities. Applicant eligibility and local submission times must be checked in the source announcement.
    keywords: ['"artificial intelligence"', '"digital transformation"', '"customer relationship management"']
  - {id: etenders_ni, name: eTendersNI, enabled: false, collector: external_adapter, website: 'https://etendersni.gov.uk', access: official API or supplier alerts}
